version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: forshare_web
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    # Install dependencies and start development server
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env
